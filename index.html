<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gerbang &mdash; Masuk / Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scene">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 120 120" width="72" height="72">
        <circle cx="60" cy="60" r="58" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="60" cy="60" r="46" fill="none" stroke="var(--accent)" stroke-width="1"/>
        <path d="M60 34 L60 86 M40 46 L60 34 L80 46" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="60" cy="60" r="4" fill="var(--accent)"/>
      </svg>
    </div>

    <main class="card">
      <div class="card-head">
        <h1 id="formTitle">Selamat datang kembali</h1>
        <p id="formSubtitle">Masuk untuk melanjutkan ke akun Anda.</p>
      </div>

      <div class="switcher" role="tablist">
        <button type="button" class="switch-btn is-active" id="tabLogin" role="tab" aria-selected="true">Masuk</button>
        <button type="button" class="switch-btn" id="tabRegister" role="tab" aria-selected="false">Daftar</button>
      </div>

      <form id="authForm" novalidate>
        <label class="field">
          <span>Username</span>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="mis. rani_kalpataru" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Minimal 6 karakter" required />
        </label>

        <label class="field" id="confirmField" hidden>
          <span>Ulangi password</span>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Ketik ulang password" />
        </label>

        <p class="message" id="message" role="status" aria-live="polite"></p>

        <button type="submit" class="submit-btn" id="submitBtn">Masuk</button>
      </form>
    </main>

    <section class="dashboard" id="dashboard" hidden>
      <div class="seal small" aria-hidden="true">
        <svg viewBox="0 0 120 120" width="48" height="48">
          <circle cx="60" cy="60" r="58" fill="none" stroke="var(--accent)" stroke-width="2"/>
          <path d="M60 34 L60 86 M40 46 L60 34 L80 46" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>Selamat datang, <span id="dashUsername"></span></h2>
      <p>Anda sudah masuk ke sistem. Sesi ini disimpan secara aman di server.</p>
      <button type="button" class="submit-btn ghost" id="logoutBtn">Keluar</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
